<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .pet-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* 展开状态 */
    .pet-expanded {
      width: 180px;
      height: 180px;
      position: relative;
      cursor: grab;
      transition: transform 0.3s ease;
      -webkit-app-region: drag;
    }

    .pet-expanded:active {
      cursor: grabbing;
    }

    /* 宠物身体 */
    .pet-body {
      width: 120px;
      height: 100px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50% 50% 45% 45%;
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
      animation: breathe 2s ease-in-out infinite;
    }

    /* 眼睛 */
    .pet-eye {
      width: 14px;
      height: 18px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 30px;
      animation: blink 4s infinite;
    }

    .pet-eye.left { left: 32px; }
    .pet-eye.right { right: 32px; }

    .pet-eye::after {
      content: '';
      width: 8px;
      height: 10px;
      background: #1a1a2e;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      left: 3px;
    }

    /* 腮红 */
    .pet-blush {
      width: 16px;
      height: 10px;
      background: rgba(255, 182, 193, 0.6);
      border-radius: 50%;
      position: absolute;
      top: 50px;
    }

    .pet-blush.left { left: 20px; }
    .pet-blush.right { right: 20px; }

    /* 嘴巴 */
    .pet-mouth {
      width: 20px;
      height: 10px;
      border: 2px solid #1a1a2e;
      border-top: none;
      border-radius: 0 0 20px 20px;
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 耳朵 */
    .pet-ear {
      width: 30px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50% 50% 0 0;
      position: absolute;
      top: -15px;
    }

    .pet-ear.left { left: 20px; transform: rotate(-15deg); }
    .pet-ear.right { right: 20px; transform: rotate(15deg); }

    .pet-ear::after {
      content: '';
      width: 15px;
      height: 25px;
      background: rgba(255, 182, 193, 0.5);
      border-radius: 50% 50% 0 0;
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 手 */
    .pet-hand {
      width: 20px;
      height: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      position: absolute;
      bottom: 20px;
    }

    .pet-hand.left { left: 15px; transform: rotate(-20deg); }
    .pet-hand.right { right: 15px; transform: rotate(20deg); }

    /* 脚 */
    .pet-foot {
      width: 24px;
      height: 18px;
      background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
      border-radius: 50%;
      position: absolute;
      bottom: 10px;
    }

    .pet-foot.left { left: 35px; }
    .pet-foot.right { right: 35px; }

    /* 缩起状态 - 小圆球 */
    .pet-collapsed {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
      cursor: pointer;
      position: relative;
      animation: sleep-breathe 3s ease-in-out infinite;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .pet-collapsed:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 24px rgba(102, 126, 234, 0.5);
    }

    /* 睡觉的 zzz */
    .sleep-zzz {
      position: absolute;
      top: -20px;
      right: -10px;
      font-size: 14px;
      font-weight: bold;
      color: #667eea;
      opacity: 0;
      animation: zzz-float 3s ease-in-out infinite;
    }

    .sleep-zzz:nth-child(2) {
      animation-delay: 1s;
      font-size: 10px;
      top: -30px;
      right: 5px;
    }

    .sleep-zzz:nth-child(3) {
      animation-delay: 2s;
      font-size: 8px;
      top: -38px;
      right: -5px;
    }

    /* 智能座舱风格右键菜单 */
    .context-menu {
      position: fixed;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.98));
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      padding: 16px;
      min-width: 200px;
      z-index: 1000;
      display: none;
      -webkit-app-region: no-drag;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .context-menu.show {
      display: block;
      animation: menu-appear 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes menu-appear {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(-10px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .menu-item {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .menu-item:hover {
      transform: translateY(-4px) scale(1.05);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    }

    .menu-item:hover::before {
      opacity: 1;
    }

    .menu-item-icon {
      font-size: 22px;
      z-index: 1;
    }

    .menu-item-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.8);
      z-index: 1;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .menu-item:hover .menu-item-label {
      color: white;
    }

    .menu-divider {
      grid-column: span 3;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 8px 0;
    }

    /* 动画 */
    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.03); }
    }

    @keyframes blink {
      0%, 45%, 55%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }

    @keyframes sleep-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes zzz-float {
      0% { opacity: 0; transform: translateY(0) translateX(0); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px) translateX(10px); }
    }

    /* 气泡对话框 */
    .speech-bubble {
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px 16px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      font-size: 12px;
      color: #374151;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 10;
    }

    .speech-bubble.show { opacity: 1; }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid white;
    }

    /* 拖拽区域高亮 */
    .drop-zone {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px dashed transparent;
      transition: all 0.3s;
      pointer-events: none;
    }

    .drop-zone.active {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.1);
    }

    /* 任务处理中动画 */
    .processing-ring {
      position: absolute;
      inset: -10px;
      border: 2px solid transparent;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .processing-ring.show { opacity: 1; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 文件任务结果弹窗 */
    .task-result {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      background: white;
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2);
      padding: 24px;
      min-width: 280px;
      max-width: 360px;
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      -webkit-app-region: no-drag;
    }

    .task-result.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .task-result-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-result-content {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .task-result-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .task-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .task-btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .task-btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .task-btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .task-btn-secondary:hover {
      background: #e5e7eb;
    }

    /* 技能标签 */
    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .skill-tag {
      padding: 4px 10px;
      background: rgba(102, 126, 234, 0.1);
      color: #667eea;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="pet-container" id="petContainer">
    <!-- 展开状态 -->
    <div class="pet-expanded" id="petExpanded">
      <div class="drop-zone" id="dropZone"></div>
      <div class="processing-ring" id="processingRing"></div>
      <div class="speech-bubble" id="speechBubble">你好呀！我是智壳助手~<br>把文件拖给我试试！</div>
      <div class="pet-ear left"></div>
      <div class="pet-ear right"></div>
      <div class="pet-body">
        <div class="pet-eye left"></div>
        <div class="pet-eye right"></div>
        <div class="pet-blush left"></div>
        <div class="pet-blush right"></div>
        <div class="pet-mouth"></div>
      </div>
      <div class="pet-hand left"></div>
      <div class="pet-hand right"></div>
      <div class="pet-foot left"></div>
      <div class="pet-foot right"></div>
    </div>

    <!-- 缩起状态 -->
    <div class="pet-collapsed" id="petCollapsed" style="display: none;">
      <span class="sleep-zzz">Z</span>
      <span class="sleep-zzz">z</span>
      <span class="sleep-zzz">z</span>
    </div>
  </div>

  <!-- 智能座舱风格右键菜单 -->
  <div class="context-menu" id="contextMenu">
    <div class="menu-grid">
      <div class="menu-item" onclick="handleMenuAction('skills')">
        <span class="menu-item-icon">🎯</span>
        <span class="menu-item-label">技能</span>
      </div>
      <div class="menu-item" onclick="handleMenuAction('feed')">
        <span class="menu-item-icon">🍖</span>
        <span class="menu-item-label">喂食</span>
      </div>
      <div class="menu-item" onclick="handleMenuAction('play')">
        <span class="menu-item-icon">🎮</span>
        <span class="menu-item-label">玩耍</span>
      </div>
      <div class="menu-item" onclick="handleMenuAction('talk')">
        <span class="menu-item-icon">💬</span>
        <span class="menu-item-label">聊天</span>
      </div>
      <div class="menu-item" onclick="handleMenuAction('collapse')">
        <span class="menu-item-icon">😴</span>
        <span class="menu-item-label">睡觉</span>
      </div>
      <div class="menu-item" onclick="handleMenuAction('settings')">
        <span class="menu-item-icon">⚙️</span>
        <span class="menu-item-label">设置</span>
      </div>
      <div class="menu-item" onclick="handleMenuAction('hide')">
        <span class="menu-item-icon">👋</span>
        <span class="menu-item-label">隐藏</span>
      </div>
    </div>
  </div>

  <!-- 任务结果弹窗 -->
  <div class="task-result" id="taskResult">
    <div class="task-result-title" id="taskResultTitle">✨ 处理完成</div>
    <div class="task-result-content" id="taskResultContent"></div>
    <div class="skill-tags" id="skillTags"></div>
    <div class="task-result-actions">
      <button class="task-btn task-btn-secondary" onclick="closeTaskResult()">取消</button>
      <button class="task-btn task-btn-primary" onclick="executeTask()">执行</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    let isCollapsed = false
    let isDragging = false
    let dragStartX = 0
    let dragStartY = 0
    let windowStartX = 0
    let windowStartY = 0
    let currentFilePath = null
    let currentTaskType = null

    const petExpanded = document.getElementById('petExpanded')
    const petCollapsed = document.getElementById('petCollapsed')
    const petContainer = document.getElementById('petContainer')
    const contextMenu = document.getElementById('contextMenu')
    const speechBubble = document.getElementById('speechBubble')
    const dropZone = document.getElementById('dropZone')
    const processingRing = document.getElementById('processingRing')
    const taskResult = document.getElementById('taskResult')
    const taskResultTitle = document.getElementById('taskResultTitle')
    const taskResultContent = document.getElementById('taskResultContent')
    const skillTags = document.getElementById('skillTags')

    // 文件类型与技能任务映射
    const fileSkillMap = {
      // 图片
      '.png': { skill: 'image-optimizer', name: '图片优化', icon: '🖼️', desc: '压缩并优化图片质量' },
      '.jpg': { skill: 'image-optimizer', name: '图片优化', icon: '🖼️', desc: '压缩并优化图片质量' },
      '.jpeg': { skill: 'image-optimizer', name: '图片优化', icon: '🖼️', desc: '压缩并优化图片质量' },
      '.gif': { skill: 'image-optimizer', name: '图片优化', icon: '🖼️', desc: '压缩并优化图片质量' },
      '.webp': { skill: 'image-optimizer', name: '图片优化', icon: '🖼️', desc: '压缩并优化图片质量' },
      '.svg': { skill: 'svg-cleaner', name: 'SVG 清理', icon: '✨', desc: '清理并优化 SVG 代码' },

      // 文档
      '.md': { skill: 'markdown-formatter', name: 'Markdown 格式化', icon: '📝', desc: '格式化并优化 Markdown 文档' },
      '.txt': { skill: 'text-analyzer', name: '文本分析', icon: '📄', desc: '分析文本内容并生成摘要' },
      '.json': { skill: 'json-formatter', name: 'JSON 格式化', icon: '📋', desc: '格式化并验证 JSON 数据' },
      '.yaml': { skill: 'yaml-validator', name: 'YAML 验证', icon: '🔧', desc: '验证并格式化 YAML 文件' },
      '.yml': { skill: 'yaml-validator', name: 'YAML 验证', icon: '🔧', desc: '验证并格式化 YAML 文件' },

      // 代码
      '.js': { skill: 'code-reviewer', name: '代码审查', icon: '💻', desc: '审查 JavaScript 代码质量' },
      '.ts': { skill: 'code-reviewer', name: '代码审查', icon: '💻', desc: '审查 TypeScript 代码质量' },
      '.tsx': { skill: 'code-reviewer', name: '代码审查', icon: '💻', desc: '审查 TSX 代码质量' },
      '.jsx': { skill: 'code-reviewer', name: '代码审查', icon: '💻', desc: '审查 JSX 代码质量' },
      '.py': { skill: 'python-linter', name: 'Python 检查', icon: '🐍', desc: '检查 Python 代码规范' },
      '.css': { skill: 'css-optimizer', name: 'CSS 优化', icon: '🎨', desc: '优化并压缩 CSS 代码' },
      '.scss': { skill: 'css-optimizer', name: 'SCSS 优化', icon: '🎨', desc: '优化并压缩 SCSS 代码' },
      '.html': { skill: 'html-validator', name: 'HTML 验证', icon: '🌐', desc: '验证并修复 HTML 结构' },

      // 数据
      '.csv': { skill: 'csv-analyzer', name: 'CSV 分析', icon: '📊', desc: '分析 CSV 数据并生成报告' },
      '.xlsx': { skill: 'excel-converter', name: 'Excel 转换', icon: '📈', desc: '转换 Excel 为其他格式' },
      '.sql': { skill: 'sql-formatter', name: 'SQL 格式化', icon: '🗄️', desc: '格式化并优化 SQL 语句' },

      // 配置文件
      '.env': { skill: 'env-validator', name: '环境变量检查', icon: '🔐', desc: '检查环境变量配置' },
      '.gitignore': { skill: 'gitignore-checker', name: 'Gitignore 检查', icon: '📁', desc: '检查 Gitignore 规则' },
      '.dockerfile': { skill: 'docker-linter', name: 'Dockerfile 检查', icon: '🐳', desc: '检查 Dockerfile 规范' },
    }

    // 获取文件扩展名
    function getFileExtension(filename) {
      return filename.slice(filename.lastIndexOf('.')).toLowerCase()
    }

    // 识别文件技能
    function detectFileSkill(filePath) {
      const ext = getFileExtension(filePath)
      return fileSkillMap[ext] || { skill: 'file-analyzer', name: '文件分析', icon: '📦', desc: '分析文件内容并提供建议' }
    }

    // 切换展开/缩起
    function toggleCollapse() {
      isCollapsed = !isCollapsed
      if (isCollapsed) {
        petExpanded.style.display = 'none'
        petCollapsed.style.display = 'block'
        ipcRenderer.send('pet:resize', { width: 60, height: 60 })
        ipcRenderer.send('pet:click-through', false) // 保持可点击
      } else {
        petExpanded.style.display = 'block'
        petCollapsed.style.display = 'none'
        ipcRenderer.send('pet:resize', { width: 200, height: 200 })
        ipcRenderer.send('pet:click-through', false)
        showSpeech('我醒啦！把文件拖给我吧~')
      }
    }

    // 显示气泡
    function showSpeech(text, duration = 3000) {
      speechBubble.innerHTML = text
      speechBubble.classList.add('show')
      setTimeout(() => {
        speechBubble.classList.remove('show')
      }, duration)
    }

    // 显示任务结果
    function showTaskResult(skill, fileName) {
      taskResultTitle.innerHTML = `${skill.icon} ${skill.name}`
      taskResultContent.innerHTML = `
        <strong>文件：</strong>${fileName}<br>
        <strong>操作：</strong>${skill.desc}
      `
      skillTags.innerHTML = `
        <span class="skill-tag">${skill.skill}</span>
        <span class="skill-tag">自动识别</span>
      `
      taskResult.classList.add('show')
    }

    // 关闭任务结果
    function closeTaskResult() {
      taskResult.classList.remove('show')
      currentFilePath = null
      currentTaskType = null
    }

    // 执行任务
    function executeTask() {
      if (!currentFilePath || !currentTaskType) return

      processingRing.classList.add('show')
      closeTaskResult()
      showSpeech('正在处理中...', 5000)

      // 发送任务到主进程
      ipcRenderer.send('pet:execute-task', {
        filePath: currentFilePath,
        skill: currentTaskType.skill
      })

      // 模拟处理完成
      setTimeout(() => {
        processingRing.classList.remove('show')
        showSpeech('✅ 处理完成！已保存到桌面', 4000)
      }, 2000)
    }

    // 拖拽文件进入
    document.addEventListener('dragenter', (e) => {
      e.preventDefault()
      e.stopPropagation()
      console.log('📁 [Drag] File entered')
      if (!isCollapsed) {
        dropZone.classList.add('active')
        showSpeech('松开即可处理文件！', 2000)
      }
    })

    // 拖拽文件悬停
    document.addEventListener('dragover', (e) => {
      e.preventDefault()
      e.stopPropagation()
    })

    // 拖拽文件离开
    document.addEventListener('dragleave', (e) => {
      e.preventDefault()
      e.stopPropagation()
      dropZone.classList.remove('active')
    })

    // 放置文件
    document.addEventListener('drop', (e) => {
      e.preventDefault()
      e.stopPropagation()
      console.log('📁 [Drop] File dropped')
      dropZone.classList.remove('active')

      if (isCollapsed) {
        showSpeech('先叫醒我才能处理文件哦~')
        return
      }

      const files = e.dataTransfer.files
      if (files.length > 0) {
        const file = files[0]
        const filePath = file.path
        const fileName = file.name

        // 识别文件类型和技能
        const skill = detectFileSkill(filePath)
        currentFilePath = filePath
        currentTaskType = skill

        // 显示处理选项
        showTaskResult(skill, fileName)

        // 宠物反应
        const reactions = [
          `发现 ${skill.name} 任务！`,
          `我来帮你处理这个 ${fileName}！`,
          `交给我吧！擅长 ${skill.name}~`,
          `检测到文件，准备 ${skill.name}！`
        ]
        showSpeech(reactions[Math.floor(Math.random() * reactions.length)], 3000)
      }
    })

    // 点击宠物
    petExpanded.addEventListener('click', (e) => {
      if (!isDragging && !taskResult.classList.contains('show')) {
        const messages = [
          '你好呀！把文件拖给我试试~',
          '今天也要加油哦！',
          '我在陪着你呢~',
          '要不要创建一个新技能？',
          '记得休息一下眼睛哦',
          '拖入文件，我帮你处理！'
        ]
        showSpeech(messages[Math.floor(Math.random() * messages.length)])
      }
    })

    // 点击缩起的宠物
    petCollapsed.addEventListener('click', () => {
      toggleCollapse()
    })

    // 拖拽移动
    petExpanded.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        isDragging = false
        dragStartX = e.screenX
        dragStartY = e.screenY
        windowStartX = window.screenX
        windowStartY = window.screenY

        const handleMouseMove = (e) => {
          const dx = e.screenX - dragStartX
          const dy = e.screenY - dragStartY
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            isDragging = true
          }
          ipcRenderer.send('pet:move', {
            x: windowStartX + dx,
            y: windowStartY + dy
          })
        }

        const handleMouseUp = () => {
          document.removeEventListener('mousemove', handleMouseMove)
          document.removeEventListener('mouseup', handleMouseUp)
          setTimeout(() => { isDragging = false }, 100)
        }

        document.addEventListener('mousemove', handleMouseMove)
        document.addEventListener('mouseup', handleMouseUp)
      }
    })

    // 右键菜单
    petContainer.addEventListener('contextmenu', (e) => {
      e.preventDefault()

      // 获取窗口尺寸
      const windowWidth = window.innerWidth
      const windowHeight = window.innerHeight

      // 菜单预估尺寸
      const menuWidth = 180
      const menuHeight = 280

      // 计算菜单位置，确保不超出窗口
      let menuX = e.clientX
      let menuY = e.clientY

      // 如果右侧空间不足，菜单向左展开
      if (menuX + menuWidth > windowWidth) {
        menuX = windowWidth - menuWidth - 10
      }

      // 如果底部空间不足，菜单向上展开
      if (menuY + menuHeight > windowHeight) {
        menuY = windowHeight - menuHeight - 10
      }

      // 确保不超出左上角
      menuX = Math.max(10, menuX)
      menuY = Math.max(10, menuY)

      contextMenu.style.left = menuX + 'px'
      contextMenu.style.top = menuY + 'px'
      contextMenu.classList.add('show')
    })

    // 点击其他地方关闭菜单
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.context-menu') && !e.target.closest('.task-result')) {
        contextMenu.classList.remove('show')
      }
    })

    // 菜单操作
    function handleMenuAction(action) {
      contextMenu.classList.remove('show')
      switch (action) {
        case 'skills':
          showSpeech('我的技能：图片优化、代码审查、文本分析、JSON格式化...')
          break
        case 'feed':
          showSpeech('yummy! 谢谢你的喂食~')
          break
        case 'play':
          showSpeech('好呀！我们来玩吧！')
          break
        case 'talk':
          showSpeech('你想聊些什么呢？')
          break
        case 'collapse':
          toggleCollapse()
          break
        case 'settings':
          ipcRenderer.send('pet:open-main')
          break
        case 'hide':
          ipcRenderer.send('pet:hide')
          break
      }
    }

    // 监听主进程消息
    ipcRenderer.on('pet:show-speech', (_event, text) => {
      showSpeech(text)
    })

    ipcRenderer.on('pet:task-complete', (_event, result) => {
      processingRing.classList.remove('show')
      if (result.success) {
        showSpeech(`✅ ${result.message}`, 4000)
      } else {
        showSpeech(`❌ ${result.error}`, 4000)
      }
    })
  </script>
</body>
</html>
