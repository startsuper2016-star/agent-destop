<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="600" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Electron 应用架构图</text>

  <!-- 主进程区域 -->
  <rect x="60" y="70" width="260" height="200" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">主进程 (Main Process)</text>
  <text x="190" y="115" text-anchor="middle" font-size="11" fill="#3b82f6">Node.js 环境</text>

  <!-- 主进程内部组件 -->
  <rect x="85" y="135" width="210" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">BrowserWindow</text>
  <text x="190" y="172" text-anchor="middle" font-size="10" fill="#6b7280">窗口管理、生命周期控制</text>

  <rect x="85" y="200" width="100" height="45" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">app</text>
  <text x="135" y="235" text-anchor="middle" font-size="9" fill="#6b7280">应用事件</text>

  <rect x="195" y="200" width="100" height="45" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="245" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">shell</text>
  <text x="245" y="235" text-anchor="middle" font-size="9" fill="#6b7280">系统调用</text>

  <!-- 预加载脚本区域 -->
  <rect x="350" y="70" width="260" height="200" rx="8" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">预加载脚本 (Preload)</text>
  <text x="480" y="115" text-anchor="middle" font-size="11" fill="#f59e0b">安全桥梁</text>

  <rect x="375" y="135" width="210" height="50" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="480" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">contextBridge</text>
  <text x="480" y="172" text-anchor="middle" font-size="10" fill="#6b7280">安全暴露 API 给渲染进程</text>

  <rect x="375" y="200" width="100" height="45" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="425" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">ipcRenderer</text>
  <text x="425" y="235" text-anchor="middle" font-size="9" fill="#6b7280">IPC 通信</text>

  <rect x="485" y="200" width="100" height="45" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="535" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">electronAPI</text>
  <text x="535" y="235" text-anchor="middle" font-size="9" fill="#6b7280">工具 API</text>

  <!-- 渲染进程区域 -->
  <rect x="640" y="70" width="260" height="200" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="770" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">渲染进程 (Renderer)</text>
  <text x="770" y="115" text-anchor="middle" font-size="11" fill="#10b981">Chromium 环境</text>

  <rect x="665" y="135" width="210" height="50" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="770" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">React App</text>
  <text x="770" y="172" text-anchor="middle" font-size="10" fill="#6b7280">UI 组件、用户交互</text>

  <rect x="665" y="200" width="100" height="45" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="715" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">window.api</text>
  <text x="715" y="235" text-anchor="middle" font-size="9" fill="#6b7280">暴露的 API</text>

  <rect x="775" y="200" width="100" height="45" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="825" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">DOM/BOM</text>
  <text x="825" y="235" text-anchor="middle" font-size="9" fill="#6b7280">浏览器 API</text>

  <!-- 箭头连接 -->
  <!-- 主进程 -> 预加载 -->
  <line x1="320" y1="160" x2="350" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="325" y="145" width="50" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="350" y="157" text-anchor="middle" font-size="9" fill="#2563eb">加载</text>

  <!-- 预加载 -> 渲染进程 -->
  <line x1="610" y1="160" x2="640" y2="160" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="615" y="145" width="50" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="640" y="157" text-anchor="middle" font-size="9" fill="#ea580c">暴露 API</text>

  <!-- IPC 双向通信 -->
  <path d="M 190 280 Q 190 320 480 320 Q 770 320 770 280" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <rect x="440" y="312" width="80" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="480" y="324" text-anchor="middle" font-size="9" fill="#059669">IPC 双向通信</text>

  <!-- 构建流程区域 -->
  <rect x="60" y="360" width="840" height="210" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="480" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">构建与打包流程</text>

  <!-- 源代码 -->
  <rect x="85" y="410" width="120" height="55" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="145" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">源代码 (src/)</text>
  <text x="145" y="447" text-anchor="middle" font-size="9" fill="#6b7280">TypeScript + React</text>
  <text x="145" y="459" text-anchor="middle" font-size="9" fill="#6b7280">TSX / CSS / HTML</text>

  <!-- electron-vite -->
  <rect x="250" y="410" width="130" height="55" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="315" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">electron-vite</text>
  <text x="315" y="447" text-anchor="middle" font-size="9" fill="#6b7280">多进程构建</text>
  <text x="315" y="459" text-anchor="middle" font-size="9" fill="#6b7280">开发服务器 + HMR</text>

  <!-- 编译输出 -->
  <rect x="430" y="410" width="120" height="55" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">编译输出 (out/)</text>
  <text x="490" y="447" text-anchor="middle" font-size="9" fill="#6b7280">main / preload / renderer</text>
  <text x="490" y="459" text-anchor="middle" font-size="9" fill="#6b7280">JS + HTML + CSS</text>

  <!-- electron-builder -->
  <rect x="590" y="410" width="130" height="55" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="655" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">electron-builder</text>
  <text x="655" y="447" text-anchor="middle" font-size="9" fill="#6b7280">跨平台打包</text>
  <text x="655" y="459" text-anchor="middle" font-size="9" fill="#6b7280">ASAR + 安装程序</text>

  <!-- 分发包 -->
  <rect x="760" y="410" width="120" height="55" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="820" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">分发包 (dist/)</text>
  <text x="820" y="447" text-anchor="middle" font-size="9" fill="#6b7280">.exe / .dmg / AppImage</text>
  <text x="820" y="459" text-anchor="middle" font-size="9" fill="#6b7280">各平台安装程序</text>

  <!-- 构建流程箭头 -->
  <line x1="205" y1="437" x2="240" y2="437" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="437" x2="420" y2="437" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="437" x2="580" y2="437" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="437" x2="750" y2="437" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 开发模式分支 -->
  <path d="M 315 465 L 315 490 L 490 490 L 490 465" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="400" y="485" text-anchor="middle" font-size="10" fill="#4f46e5">开发模式：electron-vite dev 直接启动，跳过打包</text>

  <!-- 图例 -->
  <rect x="60" y="530" width="840" height="50" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="80" y="545" font-size="11" font-weight="bold" fill="#374151">图例：</text>
  <line x1="130" y1="541" x2="160" y2="541" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="165" y="545" font-size="10" fill="#6b7280">主进程通信</text>
  <line x1="240" y1="541" x2="270" y2="541" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="275" y="545" font-size="10" fill="#6b7280">预加载暴露</text>
  <line x1="350" y1="541" x2="380" y2="541" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="385" y="545" font-size="10" fill="#6b7280">IPC 双向</text>
</svg>