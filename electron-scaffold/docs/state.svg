<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#fafafa"/>
  <text x="480" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Electron 应用生命周期状态图</text>

  <!-- 初始状态 -->
  <circle cx="120" cy="100" r="10" fill="#1f2937"/>
  <line x1="120" y1="110" x2="120" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 应用未启动 -->
  <rect x="60" y="140" width="120" height="50" rx="25" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="120" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#374151">应用未启动</text>

  <!-- 启动中 -->
  <rect x="260" y="140" width="120" height="50" rx="25" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">启动中</text>

  <!-- 运行中 -->
  <rect x="460" y="140" width="120" height="50" rx="25" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="520" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">运行中</text>

  <!-- 窗口最小化 -->
  <rect x="660" y="80" width="120" height="50" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="720" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">窗口最小化</text>

  <!-- 后台运行(macOS) -->
  <rect x="660" y="200" width="140" height="50" rx="25" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">后台运行 (macOS)</text>

  <!-- 退出中 -->
  <rect x="460" y="320" width="120" height="50" rx="25" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">退出中</text>

  <!-- 已退出 -->
  <circle cx="520" cy="450" r="12" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
  <circle cx="520" cy="450" r="6" fill="#1f2937"/>

  <!-- 转换箭头 -->

  <!-- 未启动 -> 启动中 -->
  <line x1="180" y1="165" x2="250" y2="165" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="185" y="150" width="70" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="220" y="162" text-anchor="middle" font-size="9" fill="#6b7280">用户启动</text>

  <!-- 启动中 -> 运行中 -->
  <line x1="380" y1="165" x2="450" y2="165" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="385" y="150" width="70" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="420" y="162" text-anchor="middle" font-size="9" fill="#ea580c">app.ready</text>

  <!-- 运行中 -> 窗口最小化 -->
  <path d="M 580 150 Q 620 105 650 105" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="595" y="108" width="70" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="630" y="120" text-anchor="middle" font-size="9" fill="#2563eb">最小化窗口</text>

  <!-- 窗口最小化 -> 运行中 -->
  <path d="M 660 130 Q 620 175 580 175" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="595" y="175" width="70" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="630" y="187" text-anchor="middle" font-size="9" fill="#2563eb">恢复窗口</text>

  <!-- 运行中 -> 后台运行(macOS) -->
  <path d="M 580 180 Q 620 225 650 225" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585" y="195" width="80" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="625" y="207" text-anchor="middle" font-size="9" fill="#7c3aed">关闭窗口(macOS)</text>

  <!-- 后台运行 -> 运行中 -->
  <path d="M 660 225 Q 620 190 580 190" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="585" y="215" width="80" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="625" y="227" text-anchor="middle" font-size="9" fill="#7c3aed">点击 Dock 图标</text>

  <!-- 运行中 -> 退出中 -->
  <line x1="520" y1="190" x2="520" y2="310" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="525" y="235" width="80" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="565" y="247" text-anchor="middle" font-size="9" fill="#dc2626">关闭窗口(Win/Linux)</text>

  <!-- 退出中 -> 已退出 -->
  <line x1="520" y1="370" x2="520" y2="430" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="525" y="390" width="70" height="16" fill="#fafafa" opacity="0.95"/>
  <text x="560" y="402" text-anchor="middle" font-size="9" fill="#dc2626">app.quit()</text>

  <!-- 说明框 -->
  <rect x="60" y="280" width="340" height="260" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="80" y="305" font-size="14" font-weight="bold" fill="#374151">状态说明</text>

  <text x="80" y="335" font-size="12" font-weight="bold" fill="#6b7280">应用未启动</text>
  <text x="80" y="352" font-size="10" fill="#6b7280">Electron 应用尚未运行，无进程存在</text>

  <text x="80" y="380" font-size="12" font-weight="bold" fill="#ea580c">启动中</text>
  <text x="80" y="397" font-size="10" fill="#6b7280">主进程初始化，加载预加载脚本，创建窗口</text>
  <text x="80" y="412" font-size="10" fill="#6b7280">触发事件: app.whenReady()</text>

  <text x="80" y="440" font-size="12" font-weight="bold" fill="#059669">运行中</text>
  <text x="80" y="457" font-size="10" fill="#6b7280">窗口显示，用户可交互，IPC 通信正常</text>
  <text x="80" y="472" font-size="10" fill="#6b7280">事件: ready-to-show, browser-window-created</text>

  <text x="80" y="500" font-size="12" font-weight="bold" fill="#2563eb">窗口最小化</text>
  <text x="80" y="517" font-size="10" fill="#6b7280">窗口缩小到任务栏，应用仍在运行</text>

  <text x="80" y="545" font-size="12" font-weight="bold" fill="#7c3aed">后台运行(macOS)</text>
  <text x="80" y="562" font-size="10" fill="#6b7280">macOS 特性：关闭窗口后应用仍在后台</text>
  <text x="80" y="577" font-size="10" fill="#6b7280">点击 Dock 可恢复，Cmd+Q 才完全退出</text>

  <text x="80" y="605" font-size="12" font-weight="bold" fill="#dc2626">退出中</text>
  <text x="80" y="622" font-size="10" fill="#6b7280">清理资源，关闭所有窗口，保存状态</text>
  <text x="80" y="637" font-size="10" fill="#6b7280">事件: window-all-closed, before-quit</text>

  <!-- 右侧平台差异说明 -->
  <rect x="420" y="420" width="480" height="120" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="445" font-size="13" font-weight="bold" fill="#92400e">平台差异说明</text>

  <text x="440" y="470" font-size="11" fill="#78350f">Windows / Linux:</text>
  <text x="440" y="488" font-size="10" fill="#6b7280">关闭最后一个窗口 → 应用直接退出 (window-all-closed 中调用 app.quit())</text>

  <text x="440" y="515" font-size="11" fill="#78350f">macOS:</text>
  <text x="440" y="533" font-size="10" fill="#6b7280">关闭窗口 → 应用进入后台运行，Dock 图标仍在</text>
  <text x="440" y="550" font-size="10" fill="#6b7280">点击 Dock 图标 → 重新创建窗口 (activate 事件)</text>
  <text x="440" y="567" font-size="10" fill="#6b7280">Cmd+Q 或右键退出 → 应用才真正退出</text>
</svg>